name: CI CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_publish:
        description: Publish the current ref image to GHCR
        required: false
        default: false
        type: boolean
      run_deploy:
        description: Deploy to the VPS after validation
        required: false
        default: false
        type: boolean
      deploy_image_tag:
        description: Existing GHCR image tag to deploy manually (defaults to current commit SHA when publishing in the same run)
        required: false
        default: ""
        type: string

concurrency:
  group: workos-main
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/moises-kalebbe/workos-26

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run build
        run: npm run build

      - name: Run targeted tests
        run: npm test -- src/test/meetingMinutes.test.ts src/test/localDbClient.test.ts src/test/topBar.test.tsx

  publish:
    if: >-
      (github.event_name == 'push' && vars.ENABLE_GHCR_PUBLISH == 'true') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_publish == 'true')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: >-
      always() &&
      needs.build.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped') &&
      (
        (github.event_name == 'push' && vars.ENABLE_GHCR_PUBLISH == 'true' && vars.ENABLE_VPS_DEPLOY == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.run_deploy == 'true')
      )
    needs:
      - build
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT }}
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      RUN_PUBLISH_INPUT: ${{ github.event.inputs.run_publish }}
      RUN_DEPLOY_INPUT: ${{ github.event.inputs.run_deploy }}
      DEPLOY_IMAGE_TAG_INPUT: ${{ github.event.inputs.deploy_image_tag }}
      DEPLOY_IMAGE_TAG: ${{ github.event.inputs.deploy_image_tag || github.sha }}

    steps:
      - name: Validate deploy configuration
        run: |
          test -n "${VPS_HOST}" || { echo "VPS_HOST not configured"; exit 1; }
          test -n "${VPS_USER}" || { echo "VPS_USER not configured"; exit 1; }
          test -n "${APP_BASE_URL}" || { echo "APP_BASE_URL not configured"; exit 1; }
          test -n "${VPS_SSH_KEY}" || { echo "VPS_SSH_KEY not configured"; exit 1; }
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${RUN_DEPLOY_INPUT}" = "true" ] && [ "${RUN_PUBLISH_INPUT}" != "true" ] && [ -z "${DEPLOY_IMAGE_TAG_INPUT}" ]; then
            echo "deploy_image_tag is required when manually deploying without publishing in the same run"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          if grep -q '^-----BEGIN ' <<< "${VPS_SSH_KEY}"; then
            printf '%s' "${VPS_SSH_KEY}" | tr -d '\r' > ~/.ssh/id_ed25519
          else
            printf '%s' "${VPS_SSH_KEY}" | tr -d '\r\n ' | base64 --decode | tr -d '\r' > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keyscan -p "${VPS_PORT:-22}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts

      - name: Create Docker context
        shell: bash
        run: |
          set -euo pipefail
          docker context rm production >/dev/null 2>&1 || true
          docker context create production --docker "host=ssh://${VPS_USER}@${VPS_HOST}:${VPS_PORT:-22}"

      - name: Deploy service
        shell: bash
        run: |
          set -euo pipefail
          docker --context production service update \
            --with-registry-auth \
            --image "${IMAGE_NAME}:${DEPLOY_IMAGE_TAG}" \
            workos_workos

      - name: Verify swarm rollout
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            status="$(docker --context production service ps workos_workos --filter desired-state=running --format '{{.Name}} {{.CurrentState}} {{.Error}}' --no-trunc)"
            current_image="$(docker --context production service inspect workos_workos --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')"
            echo "${status}"
            echo "${current_image}"
            if ! grep -Eq 'Rejected|Failed' <<< "${status}" && grep -q 'Running' <<< "${status}" && grep -q "${DEPLOY_IMAGE_TAG}" <<< "${current_image}"; then
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              echo "Service did not stabilize in time"
              exit 1
            fi
            sleep 5
          done
          docker --context production service inspect workos_workos --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}'

      - name: Smoke test public routes
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${APP_BASE_URL}"
          curl -fsSL "${BASE_URL}/financeiro" >/dev/null
          curl -fsSL "${BASE_URL}/evolucao" >/dev/null
