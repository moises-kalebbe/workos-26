version: "3.8"

services:
  workos-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-workos-user}
      POSTGRES_DB: ${POSTGRES_DB:-workos-db}
    volumes:
      - workos-postgres-data:/var/lib/postgresql/data
    networks:
      - workos-network
    deploy:
      restart_policy:
        condition: any

  workos:
    image: ghcr.io/moises-kalebbe/workos-26:latest
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0

      DATABASE_URL: postgresql://${POSTGRES_USER:-workos-user}:${POSTGRES_PASSWORD}@workos-postgres:5432/${POSTGRES_DB:-workos-db}

      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}

      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-moonshotai/kimi-k2.6}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      # Mercado Pago
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}

      # WhatsApp Bot (Evolution API)
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-https://evo.moiseskalebbe.cloud}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-MoiKalebbe}
      EVOLUTION_WEBHOOK_TOKEN: ${EVOLUTION_WEBHOOK_TOKEN}
      EVOLUTION_OWNER_NUMBER: ${EVOLUTION_OWNER_NUMBER:-5519984182870}
    networks:
      - workos-network
      - MoiKalebbe
    depends_on:
      - workos-postgres
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        - traefik.docker.network=MoiKalebbe
        - traefik.http.routers.workos.rule=Host(`${WORKOS_DOMAIN:-workos.moiseskalebbe.cloud}`)
        - traefik.http.routers.workos.entrypoints=websecure
        - traefik.http.routers.workos.tls.certresolver=letsencryptresolver
        - traefik.http.routers.workos.service=workos
        - traefik.http.services.workos.loadbalancer.server.port=3000

volumes:
  workos-postgres-data:

networks:
  workos-network:
    driver: overlay
  MoiKalebbe:
    external: true
    name: MoiKalebbe
